# Prometheus configuration for the Intent-Based Grafana lab (SPEC section 2).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Native Open5GS metrics: only AMF/SMF/UPF/PCF expose them in v2.8.0.
  - job_name: open5gs
    static_configs:
      - targets: ["amf:9091", "smf:9091", "upf:9091", "pcf:9091"]

  # Per-container CPU / memory / network (label name="ibg-<service>").
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host metrics.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Custom exporter: container up, SBI up, interface counters, qdisc, path.
  - job_name: ibg_exporter
    static_configs:
      - targets: ["exporter:9200"]

  - job_name: intent_engine
    static_configs:
      - targets: ["intent-engine:8088"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
